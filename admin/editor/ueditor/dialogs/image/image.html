<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>ueditor图片对话框</title>
<script type="text/javascript" src="../internal.js"></script> 
<!-- image dialog -->
<link rel="stylesheet" href="image.css" type="text/css" />
</head>
<body>
<div class="wrapper">
 <div id="tabhead" class="tabhead"> <span class="tab focus" data-content-id="remote"><var id="lang_tab_remote"></var></span> </div>
 <div id="tabbody" class="tabbody"> 
  
  <!-- 远程图片 -->
  <div id="remote" class="panel focus">
   <div class="top">
    <div class="row">
     <label for="url"><var id="lang_input_url"></var></label>
     <span>
     <input class="text" id="url" type="text"/>
     </span> </div>
   </div>
   <div class="left">
    <div class="row">
     <label><var id="lang_input_size"></var></label>
     <span><var id="lang_input_width">&nbsp;&nbsp;</var>
     <input class="text" type="text" id="width"/>
     px </span> <span><var id="lang_input_height">&nbsp;&nbsp;</var>
     <input class="text" type="text" id="height"/>
     px </span> <span>
     <input id="lock" type="checkbox" disabled="disabled">
     <span id="lockicon"></span></span> </div>
    <div class="row">
     <label><var id="lang_input_border"></var></label>
     <span>
     <input class="text" type="text" id="border"/>
     px </span> </div>
    <div class="row">
     <label><var id="lang_input_vhspace"></var></label>
     <span>
     <input class="text" type="text" id="vhSpace"/>
     px </span> </div>
    <div class="row">
     <label><var id="lang_input_title"></var></label>
     <span>
     <input class="text" type="text" id="title"/>
     </span> </div>
   </div>
   <div class="right">
    <div id="preview"></div>
   </div>
  </div>
 </div>
</div>
<script type="text/javascript" src="image.js"></script>
</body>
</html>
