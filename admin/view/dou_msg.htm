<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<!-- {if $msg_url} -->
<meta http-equiv="refresh" content="{$time}; URL={$msg_url}" />
<!-- {/if} -->
<meta name="csrf-token" content="{$csrf_token}">
<title>{$lang.home}{if $ur_here} - {$ur_here} {/if}</title>
<meta name="copyright" content="DouCo Co.,Ltd." />
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<link href="css/bootstrap-icons.css" rel="stylesheet" type="text/css">
<link href="css/common.css" rel="stylesheet" type="text/css">
<link href="css/dou_msg.css" rel="stylesheet" type="text/css">
{include file="inc/javascript.tpl"}
<!-- {if !$msg_url} -->
<script type="text/javascript">
{literal}
function go()
{
window.history.go(-1);
}
setTimeout("go()",3000);
{/literal}
</script>
<!-- {/if} -->
</head>
<body>
<!-- {if $out neq 'out'} -->
<div id="dou">
 {include file="inc/header.tpl"}
 {include file="inc/sidebar.tpl"}
 <div id="dou-content">
  {include file="inc/toolbar.tpl"}
  <div class="dou-main">
   <div class="dou-page">
   {include file="inc/page_header.tpl"}
   <div id="dou-msg">
    <h2>{$text}</h2>
    <dl>
     <dt>{$cue}</dt>
     <!-- {if $check} -->
     <p><form action="{$check}" method="post"><!-- {if $check_method} --><input type="hidden" name="_method" value="{$check_method}" /><!-- {/if} --><input type="hidden" name="token" value="{$token}" /><input name="confirm" class="btn" type="submit" value="{if $btn_value}{$btn_value}{else}{$lang.del_confirm}{/if}" /></form></p>
     <!-- {/if} -->
     <dd><a href="{if $msg_url}{$msg_url}{else}javascript:history.go(-1);{/if}">{$lang.dou_msg_back}</a></dd>
    </dl>
   </div>
  </div>
 </div>
  </div>
 {include file="inc/footer.tpl"}
</div>
<!-- {else} -->
<div id="out-msg">
 <h2>{$text}</h2>
 <dl>
  <dt>{$cue}</dt>
  <dd><a href="{if $msg_url}{$msg_url}{else}javascript:history.go(-1);{/if}">{$lang.dou_msg_back}</a></dd>
 </dl>
</div>
<!-- {/if} -->
</body>
</html>
