name: 功能与架构建议
description: 面向开发者的功能或架构改进建议。安装、使用、配置类问题不在受理范围。
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本模板面向代码级功能改进与架构建议。请说明**要解决什么问题、涉及哪些模块、预期行为是什么**。单纯的使用/配置疑问不在受理范围。
  - type: textarea
    id: background
    attributes:
      label: 需求背景
      description: 当前存在什么限制或问题，为什么需要这个改动。
      placeholder: 例如：路由分发与控制器绑定耦合，新增模块时必须改动核心文件。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 描述你期望的行为或实现方向，而不是只写“优化一下”。
      placeholder: 例如：将路由注册改为配置驱动，模块目录下声明独立路由文件。
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: 涉及模块或文件（如能判断）
      description: 你预计会改动或受影响的模块路径，便于评估影响范围。
      placeholder: 例如：core/foundation/routing/
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与影响
      description: 是否考虑过其他实现方式；是否涉及兼容性、数据库结构或升级脚本。
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issue，确认没有重复建议
          required: true
        - label: 我有意愿提交 PR 实现该建议（非强制）
          required: false
